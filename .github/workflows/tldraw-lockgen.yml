name: finalize tldraw lockfile

on:
  push:
    branches: [spatial-v3-tldraw-editor]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spatial-v3-tldraw-editor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/tldraw-lockgen.yml
          git commit -m "Lock tldraw frontend dependencies"
          git push origin HEAD:spatial-v3-tldraw-editor
