name: Rules migration checks

on:
  push:
    branches: [finish-stats-effects-abilities]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall app
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_rules_rework.py tests/test_spatial.py tests/test_spatial_repository.py
        env:
          PYTHONPATH: .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
